name: Feature request
description: Suggest a capability for AgentSnap
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. What do you have to do today that is awkward or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like AgentSnap to do?
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: How would you express it in agentsnap.yaml?
      description: A sketch of the configuration or assertion is more useful than prose.
      render: yaml

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Assertion
        - Snapshot
        - Sandbox or Docker
        - Adapter or agent integration
        - CLI or reporting
        - Documentation
    validations:
      required: true