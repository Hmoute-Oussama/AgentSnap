name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.11', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e

  package:
    name: Package contents and tarball install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run check:package
      - run: npm run check:install

  self-test:
    name: Run AgentSnap against itself
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # A fixed configuration with the deterministic provider: this proves the published CLI can
      # create a sandbox, run a test, assert and record a baseline without spending a token.
      # `init --provider fake` is deliberately not used here, because its scaffold asserts
      # `command_must_pass: npm test`, which would make this job run the whole suite again.
      - name: Write a self-test configuration
        run: |
          cat > agentsnap.self-test.yaml <<'YAML'
          version: 1
          agent:
            provider: fake
          defaults:
            retries: 0
            timeout:
              total: 60
              command: 30
          tests:
            - name: explains the project without touching it
              prompt: |
                say: This project has one package and no source files yet.
              assertions:
                - file_not_changed: "**/*"
                - max_tool_calls: 4
                - output_contains: "project"
            - name: writes a file when asked
              prompt: |
                say: Writing the notes file.
                write: NOTES.md
                  content: Hello from the fake provider.
              assertions:
                - file_created: "NOTES.md"
                - file_not_changed: "package.json"
          YAML

      - name: Validate the configuration
        run: node dist/cli/bin.js validate -c agentsnap.self-test.yaml

      - name: Record a baseline
        run: node dist/cli/bin.js run -c agentsnap.self-test.yaml

      - name: Compare against the recorded baseline
        run: node dist/cli/bin.js run -c agentsnap.self-test.yaml --snapshot-mode strict --reporter json > self-test-report.json

      - name: Show the console report
        if: always()
        run: node dist/cli/bin.js run -c agentsnap.self-test.yaml